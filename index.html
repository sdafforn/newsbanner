<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Daily News-Banner</title>

    <!-- Pico.css -->
    <link href="assets/css/pico/pico-2.1.1.min.css" rel="stylesheet">
    <link href="assets/css/vanilla-calendar-pro/index-3.1.0.css" rel="stylesheet">
    <script src="assets/js/vanilla-calendar-pro/index-3.1.0.js" defer></script>
    <style>
      hr {
        margin-top: 2.5rem;
        margin-bottom: 2rem;
      }
    </style>
  </head>

  <body>
    <!-- Header -->
    <header class="container">
      <hgroup>
        <h1>Daily News-Banner</h1>
        <p>View current or past editions.</p>
      </hgroup>
    </header>
    <!-- ./ Header -->

    <!-- Main -->
    <main class="container">
      <!-- Current and Past Editions -->
      <section id="editions">
        <h2>Current Edition</h2>
        <p>
          <a id="currentEditionLink" class="primary" target="_blank"></a>
        </p>

        <hr/>
        <h3>Past Editions</h3>
        <p>
          Alternatively, use the calendar below to view the edition for a publication date in the past.
        </p>
        <div id="calendar"></div>
      </section>
      <!-- ./ Current and Past Editions -->
    </main>
    <!-- ./ Main -->

    <!-- Footer -->
    <footer class="container">
      <small>Built by 3 Meats Enterprises • Celebrating the enduring legacy of Jim Barbieri</small>
    </footer>
    <!-- ./ Footer -->

    <script>
        const locale = "en-US";

        const getEditionUrl = (mm, dd, yyyy) => {
          return `https://news-banner.com/wp-content/uploads/${yyyy}/${mm}/${mm}-${dd}-${yyyy}.pdf`;
        };

        const getCurrentEditionUrl = (day) => {
          const mm = String(day.getMonth() + 1).padStart(2, '0');
          const dd = day.getDate().toString().padStart(2, '0');
          const yyyy = day.getFullYear();
          return getEditionUrl(mm, dd, yyyy);
        };

        document.addEventListener("DOMContentLoaded", function(event) {
          // default edition link
          const today = new Date();
          const month = today.toLocaleString(locale, { month: 'long' });
          let dayOfWeek = today.toLocaleDateString(locale, { weekday: 'long' });
          let dd = today.getDate().toString().padStart(2, '0');
          let isPublishedToday = true;
          if (dayOfWeek === "Sunday" || dayOfWeek === "Monday"){
              isPublishedToday = false;
              const offset = dayOfWeek === "Sunday" ? 1 : 2;
              today.setDate(today.getDate() - offset);
              dayOfWeek = today.toLocaleDateString(locale, { weekday: 'long' });
              dd = today.getDate().toString().padStart(2, '0');
          }
          const dayLabel = isPublishedToday ? "today," : "";

          const anchor = document.getElementById("currentEditionLink");
          anchor.textContent = `Click here to see the edition for ${dayLabel} ${dayOfWeek}, ${month} ${dd}`;
          anchor.href = getCurrentEditionUrl(today);

          const dateChange = (calendar) => {
              const selectedMonth = calendar.context.selectedMonth;
              const selectedYear = calendar.context.selectedYear;
              // no Monday editions after May, 2026
              let daysToExclude;
              if(selectedYear >= 2026 && selectedMonth > 4){
                daysToExclude = [0,1];
              }
              else{
                daysToExclude = [0];
              }
              calendar.set({
                selectedWeekends: daysToExclude,
                disableWeekdays: daysToExclude,
              }, {
                year: false,
                month: false,
                dates: false
              });
          };

          // calendar
          const { Calendar } = window.VanillaCalendarPro;
          const calendar = new Calendar('#calendar', {
            selectedWeekends: [0,1], //only mark Sundays and Mondays as weekends
            disableWeekdays: [0,1], //only mark Sundays and Mondays as disabled
            dateMax: new Date().toLocaleDateString('en-CA'), //no future dates
            selectedTheme: 'dark',
            selectionDatesMode: 'single', //no date range selection
            onClickDate(self, event) {
                if(self?.context?.selectedDates?.length == 1) {
                    const day = self.context.selectedDates[0].split("-");
                    const yyyy = day[0];
                    const mm = day[1];
                    const dd = day[2];
                    window.open(getEditionUrl(mm, dd, yyyy), '_blank');
                }
            },
            onClickArrow(self, event) {
              dateChange(self);
            },
            onClickMonth(self, event) {
              dateChange(self);
            },
            onClickYear(self, event) {
              dateChange(self);
            },
          });
          calendar.init();
        });
    </script>
  </body>
</html>
